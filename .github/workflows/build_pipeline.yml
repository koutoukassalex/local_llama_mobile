name: Local AI Chatbot Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI!

jobs:
  # 🍏 Job 1: Compile iOS IPA (runs on cloud macOS runner)
  build-ios:
    name: Build iOS Native IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Compile Unsigned iOS IPA
        run: |
          flutter build ios --release --no-codesign CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r local_llama_mobile.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llama-ios-ipa
          path: local_llama_mobile.ipa
