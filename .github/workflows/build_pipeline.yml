name: Local AI Chatbot Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI!

jobs:
  # 🍏 Job 1: Compile iOS IPA (runs on cloud macOS runner)
  build-ios:
    name: Build iOS Native IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false  # We handle submodules manually below

      - name: Initialize and update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          echo "=== Verifying llama_cpp submodule ==="
          ls -la android/app/src/main/cpp/llama_cpp/
          ls -la android/app/src/main/cpp/llama_cpp/src/
          ls -la android/app/src/main/cpp/llama_cpp/ggml/src/
          echo "=== Submodule file count ==="
          find android/app/src/main/cpp/llama_cpp -name "*.cpp" | wc -l

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Compile Unsigned iOS IPA
        run: |
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r local_llama_mobile.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llama-ios-ipa
          path: local_llama_mobile.ipa
