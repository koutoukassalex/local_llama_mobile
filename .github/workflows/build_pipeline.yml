name: Local AI Chatbot Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI!

jobs:
  # 🍏 Job 1: Compile iOS IPA (runs on cloud macOS runner)
  build-ios:
    name: Build iOS Native IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Compile Unsigned iOS IPA
        run: flutter build ipa --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llama-ios-archive
          path: build/ios/archive/Runner.xcarchive
