name: Local AI Chatbot Build Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger directly from GitHub UI!

jobs:
  # 🤖 Job 1: Compile Android APK (runs on ubuntu runner)
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically fetch llama.cpp core math submodule!

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Compile Release APK
        run: flutter build apk --release

      - name: Upload Android Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llama-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 🍏 Job 2: Compile iOS IPA (runs on cloud macOS runner)
  build-ios:
    name: Build iOS Native IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Compile Unsigned iOS IPA
        run: flutter build ipa --no-codesign

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-llama-ios-ipa
          path: build/ios/ipa/*.ipa
